x-logging:
  &default-logging
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "1"

services:
  nginx:
    image: nginx:1.30.6-alpine
    environment:
      TZ: Asia/Tokyo
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./www:/var/www:ro
    ports:
      - ${NGINX_PORT:-80}:80
    depends_on:
      - sparqlist
      - stanza
    logging: *default-logging
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"

  stanza:
    build:
      context: ./mobile-stanza
      dockerfile: ../docker/node/Dockerfile
    volumes:
      - ./mobile-stanza:/usr/src/app:ro
      - stanza_node_modules:/usr/src/app/node_modules
    environment:
      NODE_ENV: production
    init: true
    restart: always

  sparqlist:
    image: ghcr.io/dbcls/sparqlist:snapshot-1f5cd4c
    environment:
      TZ: Asia/Tokyo
      ADMIN_PASSWORD: ${SPARQLIST_ADMIN_PASSWORD:?Set SPARQLIST_ADMIN_PASSWORD in .env}
      SPARQLIST_TOGOVAR_SPARQL: ${SPARQLIST_TOGOVAR_SPARQL:-http://sparql-proxy:3000/proxy/sparql}
      ROOT_PATH: /sparqlist/
      BODY_SIZE_LIMIT: 1mb
      SERVER_TIMEOUT: 600000
    volumes:
      - ${TOGOVAR_MOBILE_SPARQLET}:/app/repository
    logging: *default-logging
    restart: always

volumes:
  stanza_node_modules:
